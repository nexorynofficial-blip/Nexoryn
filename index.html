<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#150c05" />
    <meta
      name="description"
      content="Nexoryn - Where Automation Meets Ambition."
    />
    <title>Nexoryn - Where Automation Meets Ambition</title>

    <!-- Resource hints. fonts.* are needed immediately; the analytics origins
         are only warmed (dns-prefetch) because gtag now loads after idle. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- Fonts: fetched at high priority but applied by /load-fonts.js so the
         stylesheet no longer blocks first paint. Anton and Unbounded were
         requested here but are not used anywhere in the site, so they are
         dropped. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap"
    />
    <script src="/load-fonts.js" defer></script>

    <!-- The hero wordmark's font. Without this the browser only discovers it after
         the CSS is parsed and the text is laid out, so it arrives last in the
         loading chain and the heading re-flows when it lands (the layout shift
         Lighthouse reports on "NEXORYN"). Fonts must be preloaded with
         crossorigin even when same-origin. -->
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="/fonts/TachyonW00-Regular.ttf"
      crossorigin
    />

    <!-- The hero video's poster is the largest element on desktop, but it is
         only requested once React has rendered the <video>. Preloading it lets
         the browser start the download immediately. Desktop only: the video
         (and poster) are not mounted on phones. -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/hero-bg.webp"
      type="image/webp"
      fetchpriority="high"
      media="(min-width: 768px)"
    />

    <!-- Site base colour as the very first paint, so there's no white flash
         between the browser's default canvas and React mounting.
         Deliberately NOT the preloader's orange: if the app ever fails to
         mount, that background is all the user sees, and an orange screen
         looks like the preloader hung forever with no way to tell. Dark just
         reads as a page still loading. -->
    <style>
      html {
        background: #150c05;
      }
    </style>

    <!-- Analytics: init queues events immediately; the gtag.js library itself
         is injected on the first scroll/tap/click/key press, or after 6 s if
         the visitor never interacts (see public/gtag-init.js). -->
    <script src="/gtag-init.js" defer></script>
    <!-- Core Web Vitals / long-task logging. Does nothing unless the URL has
         ?perf=1 (see public/perf-monitor.js). -->
    <script src="/perf-monitor.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
