<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexoryn Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <!-- Root-absolute, not /cfokp/-relative: the admin is served from the
         marketing site's origin, which is where favicon.png lives. Without
         this the browser probes /favicon.ico and logs a 404. -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA: %BASE_URL% is Vite's own placeholder for the configured `base`
         (/cfokp/) — keeps this correct in both dev (:5174/) and production
         (<site>/cfokp/) without hardcoding either. manifest.json's own
         start_url/scope are also /cfokp/, so installing this never claims
         any part of the marketing site. -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- iOS ignores the manifest for most of this and needs its own tags to
         open as a standalone app (no Safari chrome) from the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexoryn Admin" />
    <link rel="apple-touch-icon" href="%BASE_URL%nexoryn-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
